info:
  name: Get IMDB ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_URL}}/imdbId?title=Muthu alias Kaattaan&website=hotstar"
  params:
    - name: title
      value: Muthu alias Kaattaan
      type: query
    - name: website
      value: hotstar
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
