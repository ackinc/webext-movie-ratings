receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 750
    spike_limit_mib: 250
    check_interval: 5s
  batch:

exporters:
  debug:
    verbosity: detailed

  otlp_http/jaeger:
    endpoint: http://jaeger:4318

  prometheus_remote_write:
    http:
      endpoint: http://prometheus:9090/api/v1/write
    namespace: default

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp_http/jaeger]
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheus_remote_write]
    logs:
      receivers: [otlp]
      exporters: [debug]
