name: sift-backend-telemetry

services:
  otelcol:
    image: otel/opentelemetry-collector:0.164.0
    ports:
      - "127.0.0.1:4318:4318"
      # - "127.0.0.1:55679:55679"
    volumes:
      - ./collector-config.yaml:/etc/otelcol/config.yaml

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4328:4318"
    volumes:
      - ./jaeger.yaml:/jaeger/config.yaml
    command:
      - --config=/jaeger/config.yaml

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:9099:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      # we don't want to lose the dashboards we've created when we restart
      #   the container
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: {}
