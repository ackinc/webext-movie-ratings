info:
  name: Get index stats
  type: http
  seq: 3

http:
  method: GET
  url: "{{MEILISEARCH_URL}}/indexes/:indexName/stats"
  params:
    - name: indexName
      value: "{{indexName}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
