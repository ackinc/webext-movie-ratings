info:
  name: Get version
  type: http
  seq: 1

http:
  method: GET
  url: "{{MEILISEARCH_URL}}/version"
  auth: inherit

runtime:
  variables:
    - name: MEILISEARCH_URL
      value: http://localhost:7700

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
