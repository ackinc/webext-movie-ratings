info:
  name: Get index settings
  type: http
  seq: 5

http:
  method: GET
  url: "{{MEILISEARCH_URL}}/indexes/:indexName/settings"
  params:
    - name: indexName
      value: "{{indexName}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
