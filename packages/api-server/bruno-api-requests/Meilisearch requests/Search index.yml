info:
  name: Search index
  type: http
  seq: 7

http:
  method: GET
  url: "{{MEILISEARCH_URL}}/indexes/:indexName/search?limit=5&q=somefakedoc&showRankingScore=true"
  params:
    - name: limit
      value: "5"
      type: query
    - name: q
      value: somefakedoc
      type: query
    - name: showRankingScore
      value: "true"
      type: query
    - name: indexName
      value: "{{indexName}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
