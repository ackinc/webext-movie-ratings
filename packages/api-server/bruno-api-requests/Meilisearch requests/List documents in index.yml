info:
  name: List documents in index
  type: http
  seq: 5

http:
  method: GET
  url: "{{MEILISEARCH_URL}}/indexes/:indexName/documents?limit=5"
  params:
    - name: limit
      value: "5"
      type: query
    - name: indexName
      value: "{{indexName}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
