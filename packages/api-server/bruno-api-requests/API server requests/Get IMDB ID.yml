info:
  name: Get IMDB ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_URL}}/imdbId?title=Muthu alias Kaattaan&pageUrl=https://www.hotstar.com"
  params:
    - name: title
      value: Muthu alias Kaattaan
      type: query
    - name: pageUrl
      value: https://www.hotstar.com
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
