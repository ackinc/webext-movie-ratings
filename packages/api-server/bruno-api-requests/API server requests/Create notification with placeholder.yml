info:
  name: Create notification with placeholder
  type: http
  seq: 7

http:
  method: POST
  url: "{{API_URL}}/notifications"
  body:
    type: json
    data: |-
      {
        "notificationId": "TEST_NOTIFICATION_WITH_PLACEHOLDER",
        "targetPage": "filters",
        "content": "This is a test notification with a {{placeholderName}}!"
      }
  auth:
    type: bearer
    token: "{{SIFT_API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
