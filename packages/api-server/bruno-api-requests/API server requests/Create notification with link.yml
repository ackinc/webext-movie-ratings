info:
  name: Create notification with link
  type: http
  seq: 6

http:
  method: POST
  url: "{{API_URL}}/notifications"
  body:
    type: json
    data: |-
      {
        "notificationId": "TEST_NOTIFICATION_WITH_LINK",
        "targetPage": "filters",
        "content": "This is a test notification with a [link](https://example.com/)!"
      }
  auth:
    type: bearer
    token: "{{SIFT_API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
