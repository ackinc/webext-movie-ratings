# Simple workflow for deploying static content to GitHub Pages
name: Deploy website to GH Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  detect-website-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-website-changed.outputs.has_changes }}
    steps:
      - name: Get changed files
        id: get-changed-files
        uses: swaglive/action-git-diff@main
        with:
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.event.after }}
          filename-pattern: "packages/website/dist/*"
      - name: Check website among changed files
        id: check-website-changed
        run: |
          if [ "[]" == "${{ steps.get-changed-files.outputs.filenames }}" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  # Single deploy job since we're just deploying
  deploy:
    needs: detect-website-changes
    if: needs.detect-website-changes.outputs.has_changes == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the website build-output
          path: "packages/website/dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
